org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Отключено из-за гонки на Windows: несколько параллельных воркеров Gradle
# писали в одну и ту же промежуточную папку CMake-сборки одновременно, и
# Windows блокировал файл ("occupied by another process") на шаге
# configureCMakeRelease. На Linux/macOS так не бывает, только на Windows.
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
