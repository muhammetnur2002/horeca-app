org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# AGP отказывается собирать проект, если путь к нему содержит не-ASCII
# символы (например кириллицу в имени пользователя Windows,
# C:\Users\<кириллица>\...) — это ограничение самого Android Gradle
# Plugin на Windows, не связанное с кодом приложения. Официальный флаг
# отключения этой проверки (см. http://b.android.com/95744) — как
# страховка на случай, если сам проект всё же лежит в такой папке.
# Надёжнее всего при этом всё равно держать проект в пути только из
# латиницы (например C:\dev\horeca-app), это исключает похожие проблемы
# и в других инструментах (adb, NDK и т.п.).
android.overridePathCheck=true
# Отключено из-за гонки на Windows: несколько параллельных воркеров Gradle
# писали в одну и ту же промежуточную папку CMake-сборки одновременно, и
# Windows блокировал файл ("occupied by another process") на шаге
# configureCMakeRelease. На Linux/macOS так не бывает, только на Windows.
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
