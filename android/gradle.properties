# 8 ГБ кучи требовали больше памяти, чем есть на типичной машине сборки и на CI.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
# org.gradle.parallel намеренно НЕ включаем: на Windows параллельная сборка
# вместе с демоном Kotlin регулярно даёт «файл занят другим процессом»
# на файлах в build/.
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
