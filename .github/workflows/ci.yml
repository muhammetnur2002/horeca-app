name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      # Без android/key.properties сборка подписывается debug-ключом (см.
      # комментарий в android/app/build.gradle.kts) — этого достаточно,
      # чтобы поймать в CI поломки самой Android-сборки (Gradle/AGP/Kotlin,
      # манифест, ресурсы, ProGuard-правила), не имея доступа к реальному
      # release-keystore.
      - run: flutter build apk --debug
