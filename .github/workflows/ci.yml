name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      # Debug-сборка не гоняет R8/ProGuard вообще — этого достаточно, чтобы
      # поймать поломки Gradle/AGP/Kotlin, манифеста и ресурсов, но не
      # поломки от минификации (см. предупреждение в android/app/proguard-rules.pro
      # про то, что R8 может вырезать нужные Firebase-классы именно в релизе).
      - run: flutter build apk --debug
      # Без android/key.properties release-сборка подписывается debug-ключом
      # (см. комментарий в android/app/build.gradle.kts) — в Play Store так
      # публиковать нельзя, но для CI этого достаточно: isMinifyEnabled/R8
      # реально включаются только в release, и именно тут ловится класс
      # ошибок "работает в debug, падает в релизе" из-за вырезанных классов.
      - run: flutter build apk --release
