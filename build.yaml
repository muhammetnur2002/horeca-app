# Настройки кодогенерации drift.
targets:
  $default:
    builders:
      drift_dev:
        options:
          # Даты — текстом ISO-8601. Должно совпадать с DriftDatabaseOptions
          # в app_database.dart, иначе сгенерированный код разойдётся
          # с тем, как база читает значения.
          store_date_time_values_as_text: true
          named_parameters: true
