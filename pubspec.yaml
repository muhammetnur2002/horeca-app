name: horeca_app
description: Akyl — приложение для управления заявками, инвентаризацией и закрытием смены в HoReCa.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Состояние и навигация. Держим мажорные версии зафиксированными
  # (riverpod 2.x, go_router 13.x) — переход на 3.x/18.x требует отдельной
  # миграции и здесь намеренно не выполняется.
  flutter_riverpod: ^2.6.1
  go_router: ^13.2.5

  # Локальная база. Заменяет хранение данных в SharedPreferences:
  # построчные метки времени и запросы по индексам — то, без чего
  # синхронизация невозможна.
  drift: ^2.34.3
  drift_flutter: ^0.3.1

  # Идентификаторы записей генерирует устройство
  uuid: ^4.6.0

  # Хранение и сеть
  shared_preferences: ^2.5.5
  dio: ^5.11.0
  path_provider: ^2.1.5

  # Хеширование PIN-кодов
  crypto: ^3.0.7

  # Документы и обмен
  pdf: ^3.11.1
  printing: ^5.12.0
  share_plus: ^10.0.0
  file_picker: ^8.1.4
  excel: ^4.0.6

  # UI и платформенные возможности
  image_picker: ^1.2.2
  fl_chart: ^1.2.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0
  flutter_timezone: ^4.1.1
  universal_html: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Кодогенерация drift
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/licenses/third_party_licenses.txt

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D1128"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
