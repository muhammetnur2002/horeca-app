# Статический анализ проекта.
#
# Раньше здесь стоял `deprecated_member_use: ignore`, который прятал все
# предупреждения об устаревших API, а сам пакет flutter_lints не был указан
# в dev_dependencies — линтер фактически не работал ни в IDE, ни в CI.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Незакрытые Future в обработчиках приводили к молчаливым сбоям.
    - unawaited_futures
    # print() в проде — только через debugPrint или логгер.
    - avoid_print
